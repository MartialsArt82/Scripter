name: Scripter-Release
on:
  push:
    branches: [codex/scripter-release-1.5]
  workflow_dispatch:

concurrency:
  group: scripter-release-1-5
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_id == '1463949073'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Debian- und RPM-Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev rpm desktop-file-utils
      - name: Android SDK vorbereiten
        run: bash tools/install-android-sdk.sh "$RUNNER_TEMP/scripter-android"
      - name: Desktop- und Android-Pakete bauen und prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTER_ANDROID_KEYSTORE_B64: ${{ secrets.SCRIPTER_ANDROID_KEYSTORE_B64 }}
          SCRIPTER_ANDROID_KEY_PASSWORD: ${{ secrets.SCRIPTER_ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$RUNNER_TEMP/scripter-android/jdk"
          export ANDROID_HOME="$RUNNER_TEMP/scripter-android/sdk"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash tools/release-build.sh "$RUNNER_TEMP/scripter-release"
      - name: Pakete hochladen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-publish.sh "$RUNNER_TEMP/scripter-release"
