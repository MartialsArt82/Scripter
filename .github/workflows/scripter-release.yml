name: Scripter-Release
on:
  push:
    branches: [codex/scripter-release-1.3.1]

concurrency:
  group: scripter-release-1-3-1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: RPM-Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y rpm desktop-file-utils
      - name: Pakete bauen und prüfen
        run: bash tools/release-build.sh "$RUNNER_TEMP/scripter-release"
      - name: Pakete hochladen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-publish.sh "$RUNNER_TEMP/scripter-release"
