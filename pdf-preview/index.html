<!doctype html><html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'">
<title>Satzvorschau</title>
<link rel="stylesheet" href="preview.css">
<script type="module" src="preview.mjs"></script>
</head><body>
<header><strong>Satzvorschau</strong><div class="tools">
<button id="back" aria-label="Vorherige Seite">‹</button>
<input id="page" aria-label="Seite" type="number" min="1" step="1" value="1">
<span id="total"></span><button id="next" aria-label="Nächste Seite">›</button>
<label>Zoom <select id="zoom"><option value="0.75">75 %</option><option value="1" selected>100 %</option><option value="1.25">125 %</option><option value="1.5">150 %</option><option value="2">200 %</option></select></label>
</div></header>
<main><p id="status" role="status">PDF wird geladen …</p><canvas id="paper" aria-label="Druckseite" hidden></canvas></main>
</body></html>
