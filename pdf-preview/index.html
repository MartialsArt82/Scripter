<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Satzvorschau</title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.mjs"></script>
<script defer src="/i18n/i18n.js"></script><script defer src="/i18n/i18n-messages.js"></script><script defer src="/i18n/i18n-ui.js"></script>
</head>
<body>
  <header><strong>Satzvorschau</strong>
    <div class="tools">
      <button id="back" aria-label="Zur vorherigen Doppelseite" disabled>‹</button>
      <label class="jump">Seite <input id="page" type="number" min="1" step="1" value="1" disabled></label>
      <span id="total"></span>
      <button id="next" aria-label="Zur nächsten Doppelseite" disabled>›</button>
      <label class="zoom">Zoom <select id="zoom"><option value=".75">75 %</option><option value="1" selected>Einpassen</option><option value="1.25">125 %</option><option value="1.5">150 %</option><option value="2">200 %</option></select></label>
      <div id="preview-window-buttons" role="group" aria-label="Fenstersteuerung" hidden>
        <button data-action="minimize" aria-label="Fenster minimieren" title="Minimieren">−</button>
        <button data-action="toggle-maximize" aria-label="Fenster maximieren" title="Maximieren">□</button>
        <button data-action="close" aria-label="Fenster schließen" title="Schließen">×</button>
      </div>
    </div>
  </header>
  <main id="reader">
    <p id="status" role="status">PDF wird geladen …</p>
    <div id="book-space" hidden><div id="book" aria-label="Aufgeschlagenes Buch"><div id="left" class="page-holder left"></div><div id="right" class="page-holder right"></div></div></div>
    <p id="current-spread" class="sr-only" aria-live="polite"></p>
  </main>
</body>
</html>
